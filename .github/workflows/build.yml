# Every push and pull request: lint, build wv2shim.exe from source and build the
# release tarball. Each push to main publishes it as a prerelease tagged
# snapshot-VERSION. A pushed tag "vX.Y" publishes it as a full release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used by the publish steps
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git describe needs the history and tags

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 desktop-file-utils shellcheck

      - run: make check

      - name: Build tarball
        id: dist
        run: |
          make dist
          echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: nohesi-linux-${{ steps.dist.outputs.version }}
          path: nohesi-linux-*.tar.gz*

      - name: Publish snapshot prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.dist.outputs.version }}
        run: |
          tag="snapshot-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run for the same commit replaces the files.
            gh release upload "$tag" nohesi-linux-*.tar.gz* --clobber
          else
            { echo "Automatic build of $GITHUB_SHA."; echo; git log -1 --format=%B; } > notes.md
            gh release create "$tag" nohesi-linux-*.tar.gz* --prerelease \
              --target "$GITHUB_SHA" --title "Snapshot $VERSION" --notes-file notes.md
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Release notes from the previous vX.Y tag, not the last snapshot.
          prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)
          gh release create "$GITHUB_REF_NAME" nohesi-linux-*.tar.gz* --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes ${prev:+--notes-start-tag "$prev"}
